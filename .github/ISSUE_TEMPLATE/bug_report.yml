name: Bug report
description: Report reproducible behavior with sanitized bench information.
body:
  - type: markdown
    attributes:
      value: Do not attach private DBCs, real traces, credentials, serial numbers or unredacted diagnostics. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: CANvas version, OS, desktop/web/CLI, Python or executable, adapter and driver versions. State virtual or physical bench.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected vs actual behavior and a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: connection
    attributes:
      label: Bus settings (if relevant)
      description: Backend, channel, nominal/data bitrates, CAN FD and BRS. Omit serial numbers.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Error text or a redacted screenshot; distinguish TX acceptance, TX echo and real RX.

