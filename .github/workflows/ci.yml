name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      CANVAS_DATA_DIR: ${{ github.workspace }}/.canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -e ".[dev,desktop]"
      - name: Require desktop dependencies (do not silently skip Qt tests)
        run: python -c "from PySide6.QtWidgets import QApplication; import can, cantools"
      - run: python -m pytest tests -q
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install --upgrade pip build pip-audit
      - run: python -m build
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install built wheel with desktop support
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]+'[desktop]'])"
      - name: Verify installed web, CLI and desktop outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/verify_install.py" --desktop
      - name: Audit installed wheel dependencies
        run: pip-audit

